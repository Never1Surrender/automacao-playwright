name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Instalar dependências do projeto
      run: bun install

    - name: Instalar apenas o navegador Chromium
      run: bunx playwright install chromium --with-deps

    - name: Executar testes automatizados (Chromium)
      run: bunx playwright test --project=chromium
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_EMAIL_CADASTRADO: ${{ secrets.TEST_EMAIL_CADASTRADO }}
        TEST_SENHA_CADASTRADA: ${{ secrets.TEST_SENHA_CADASTRADA }}
        TEST_EMAIL_INVALIDO: ${{ secrets.TEST_EMAIL_INVALIDO }}
        TEST_SENHA_INCORRETA: ${{ secrets.TEST_SENHA_INCORRETA }}

    - name: Salvar relatório de testes
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Criar issue no Jira em caso de falha
      if: failure()
      run: |
        response=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Content-Type: application/json" \
          -u "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
          --data '{
            "fields": {
              "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
              "summary": "Falha na pipeline Playwright - run #${{ github.run_number }}",
              "issuetype": { "name": "Bug" },
              "description": {
                "type": "doc",
                "version": 1,
                "content": [{
                  "type": "paragraph",
                  "content": [{
                    "type": "text",
                    "text": "A execução automatizada de testes falhou.\n\nCommit: ${{ github.sha }}\nWorkflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }]
                }]
              }
            }
          }' \
          "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue")
        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')
        echo "HTTP status: $http_code"
        echo "Resposta: $body"
        if [ "$http_code" -ge 400 ]; then
          exit 1
        fi