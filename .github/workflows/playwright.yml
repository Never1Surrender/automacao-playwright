name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Instalar dependências do projeto
      run: bun install

    - name: Instalar apenas o navegador Chromium
      run: bunx playwright install chromium --with-deps

    - name: Executar testes automatizados (Chromium)
      run: bunx playwright test --project=chromium
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        TEST_EMAIL_CADASTRADO: ${{ secrets.TEST_EMAIL_CADASTRADO }}
        TEST_SENHA_CADASTRADA: ${{ secrets.TEST_SENHA_CADASTRADA }}
        TEST_EMAIL_INVALIDO: ${{ secrets.TEST_EMAIL_INVALIDO }}
        TEST_SENHA_INCORRETA: ${{ secrets.TEST_SENHA_INCORRETA }}

    - name: Salvar relatório de testes
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30